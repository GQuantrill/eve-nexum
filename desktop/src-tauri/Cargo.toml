[package]
name = "nexum-desktop"
version = "0.1.4"
description = "Nexum desktop app"
edition = "2021"

[lib]
name = "nexum_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "6"
url = "2"
sys-locale = "0.3"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"

# Is EVE the window in front (foreground.rs): only a copy made in EVE is used.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes"] }
# The webview itself (the same version tauri's wry uses), to reload a page
# whose web process crashed instead of leaving the window blank.
webkit2gtk = "=2.0.2"

[features]
# Microsoft Store build: no self-updater, no registry "start at login".
store = []
