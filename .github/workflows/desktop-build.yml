name: Desktop build

# Builds the Nexum desktop app installers so they can be tried on a machine
# without development tools. Download them from the run's "Artifacts".
# Test builds: unsigned, and without the update bundle (that needs the
# updater signing key, which isn't in CI yet).
on:
  workflow_dispatch:
  push:
    branches: [desktop-app, qa-desktop]
    paths: ['desktop/**', '.github/workflows/desktop-build.yml']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          # macOS is on hold (no Apple developer account yet). To bring it
          # back: - os: macos-latest / name: macos
          # 22.04: the oldest supported Ubuntu, so the AppImage and .deb run
          # on older distributions too.
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: desktop/yarn.lock
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux build libraries
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: yarn install --frozen-lockfile
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: yarn tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: nexum-desktop-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
