name: Patch notes to Discord

# Post a release's notes to the Discord #patch-notes channel when the GitHub
# release is published (`gh release create ...` publishes the tag). Triggering on
# the release event rather than the push to main means a dropped push event no
# longer loses the announcement, and we post the curated release body instead of
# raw commit subjects.
#
# Manual backstop — re-post any tag if an automatic run is ever missed:
#   gh workflow run "Patch notes to Discord" -f tag=v3.33.9
#
# Requires repo secret DISCORD_WEBHOOK_URL = the patch-notes channel webhook.
# (A GitHub Actions secret, independent of the app's runtime DISCORD_WEBHOOK_URL
# env var — make sure it's the public patch-notes webhook.)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to post (e.g. v3.33.9)"
        required: true

permissions:
  contents: read

jobs:
  patch-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Post release notes to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK:  ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO:     ${{ github.repository }}
          TAG:      ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is not set"; exit 1
          fi
          if [ -z "${TAG:-}" ]; then
            echo "::error::no release tag to post"; exit 1
          fi

          # Curated notes for this tag. body/name/url come from the API and are
          # JSON-encoded via jq below — never shell-eval'd.
          BODY=$(gh release view "$TAG" --repo "$REPO" --json body -q .body)
          NAME=$(gh release view "$TAG" --repo "$REPO" --json name -q .name)
          URL=$( gh release view "$TAG" --repo "$REPO" --json url  -q .url)

          if [ -z "${BODY//[[:space:]]/}" ]; then
            echo "Release $TAG has no notes to announce"; exit 0
          fi

          # Discord embed descriptions cap at ~4096 chars.
          if [ "${#BODY}" -gt 3800 ]; then
            BODY="${BODY:0:3800}"$'\n'"… full notes: ${URL}"
          fi

          payload=$(jq -n \
            --arg title "◈ Nexum ${NAME:-$TAG}" \
            --arg desc  "$BODY" \
            --arg url   "$URL" \
            '{ embeds: [ {
                 title: $title,
                 url: $url,
                 description: $desc,
                 color: 6003711,
                 footer: { text: "Nexum • eve-nexum.com" }
            } ] }')

          curl -fsSL -X POST -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"
          echo "Posted patch notes for $TAG"
