services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-eve_nexum}
      POSTGRES_USER: ${PG_USER:-nexum}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-nexum} -d ${PG_DB:-eve_nexum}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot job: imports the EVE SDE into Postgres, then exits. Reuses the
  # server image. The import skips itself when the static tables are already
  # populated, so this is safe to run on every `up` (no re-download). Set
  # FORCE_SDE_IMPORT=1 to force a re-import after a new CCP SDE release.
  importer:
    build:
      context: ./server
      dockerfile: Dockerfile
    # The .env file is OPTIONAL. Secrets/config are read from the environment of
    # whatever runs `docker compose` (e.g. `infisical run -- docker compose up
    # -d`); when that environment doesn't provide a var, it falls back to a
    # local .env if one is present. Either source works and neither is required,
    # so a secrets manager (Infisical) can inject everything without a plain-text
    # .env on disk.
    env_file: &optional_env
      - path: .env
        required: false
    environment: &container_env
      # Fixed for the compose network -- always override any inherited value.
      # The server reaches Postgres by service name regardless of any host-side
      # PG_PORT remap, so these three are pinned rather than passed through.
      - PG_HOST=postgres
      - PG_PORT=5432
      - NODE_ENV=production
      # Passed through from the shell / Infisical when set, else from the
      # optional .env above. ADD NEW SERVER ENV VARS HERE so they reach the
      # container under both setups. (Vars unset in every source are omitted.)
      - PG_DB
      - PG_USER
      - PG_PASSWORD
      - PG_POOL_MAX
      - PORT
      - SESSION_SECRET
      - TOKEN_ENCRYPTION_KEY
      - EVE_CLIENT_ID
      - EVE_CLIENT_SECRET
      - EVE_CALLBACK_URL
      - FRONTEND_URL
      - CORP_ID
      - CORP_MAP_SHARED
      - CORP_MAP_TIME
      - ALLIANCE_ID
      - ALLIANCE_MAP_SHARED
      - ADMIN_CHAR_ID
      - RV_REPORT_ID
      - MAX_USER_MAPS
      - MAX_CORP_MAPS
      - MAX_ALLIANCE_MAPS
      - ACCESS_REVALIDATE_MINUTES
      - CONN_LIFETIME_SWEEP_MINUTES
      - LAZY_WH_SWEEP_MINUTES
      - LOCATION_POLL_MINUTES
      - SDE_AUTO_UPDATE
      - SDE_CHECK_UTC
      - FORCE_SDE_IMPORT
      - DISCORD_WEBHOOK_URL
      - NEXUM_TELEMETRY
      - NEXUM_TELEMETRY_URL
    command: ["node", "dist/scripts/setup-db.js"]
    volumes:
      # Persist the downloaded SDE zip so re-imports don't re-fetch it.
      - sde_cache:/app/.sde-cache
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    # Same secret/config sourcing as the importer above (see its comment):
    # optional .env, everything else passed through from the shell / Infisical.
    env_file: *optional_env
    environment: *container_env
    ports:
      # Server listens on whatever PORT says. Host port matches so
      # EVE_CALLBACK_URL=http://localhost:${PORT}/auth/callback works.
      - "${PORT:-3001}:${PORT:-3001}"
    volumes:
      # The daily auto-update check spawns the importer in this container; its
      # SDE download lands here rather than bloating the container layer.
      - sde_cache:/app/.sde-cache
    depends_on:
      postgres:
        condition: service_healthy
      importer:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Optional GTM container ID baked into the build. Unset => no analytics
        # (the default for self-hosters). Set VITE_GTM_ID in .env to enable it
        # for your own deployment only.
        VITE_GTM_ID: ${VITE_GTM_ID:-}
    restart: unless-stopped
    environment:
      # Tells nginx which port to proxy /api/* and /auth/* to inside the
      # docker network. Must match the server's PORT — otherwise the
      # proxy returns 502 because nginx is asking a port nobody answers.
      API_PORT: ${PORT:-3001}
    ports:
      # Host-side WEB_PORT (default 80). nginx inside always listens on 80.
      - "${WEB_PORT:-80}:80"
    depends_on:
      - server

volumes:
  postgres_data:
  sde_cache:
